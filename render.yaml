# Jarvis-Server auf Render – kostenlos, mit einem Klick:
#   https://render.com/deploy?repo=https://github.com/anonymdtm/Jarvis/tree/proxy
# Render fragt dabei nach den zwei Werten unten (OPENROUTER_API_KEY und APP_TOKEN) – nie in eine Datei schreiben.
services:
  - type: web
    name: jarvis-warpline
    runtime: node
    region: frankfurt
    plan: free
    branch: proxy
    buildCommand: npm install --omit=dev
    startCommand: node server.js
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: OPENROUTER_API_KEY
        sync: false
      - key: APP_TOKEN
        sync: false
      - key: CF_ACCOUNT_ID
        sync: false
      - key: CF_API_TOKEN
        sync: false
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_SECRET
        sync: false
      - key: PAYPAL_MODE
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: PREMIUM_SECRET
        sync: false
